name: Fix QGIS security findings

on:
  push:
    paths:
      - tools/fix_qgis_security.py
      - .github/workflows/fix-qgis-security.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Terrain2Flow v0.30 security fixes
        run: python tools/fix_qgis_security.py
      - name: Validate Python and Bandit
        run: |
          python -m compileall -q .
          python -m pip install --quiet bandit
          bandit -r .
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow_estimator_dialog.py metadata.txt
          git commit -m "Fix QGIS security scan findings for v0.30" || exit 0
          git push
